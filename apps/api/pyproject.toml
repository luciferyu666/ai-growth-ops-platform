[project]
name = "ai-growth-ops-api"
version = "0.1.0"
description = "FastAPI backend for AI Growth Ops Platform."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "celery[redis]>=5.5,<6.0",
  "fastapi>=0.120,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "redis>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0"
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
