name: ai-growth-ops-platform

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growth_ops}
      POSTGRES_USER: ${POSTGRES_USER:-growth_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growth_ops}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Growth Ops Platform API}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://growth_ops:growth_ops@db:5432/growth_ops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-demo-header}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL:-}
      AUTH0_SCOPE: ${AUTH0_SCOPE:-openid profile email}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      NOTIFICATION_RETRY_BASE_SECONDS: ${NOTIFICATION_RETRY_BASE_SECONDS:-60}
      NOTIFICATION_RETRY_MAX_SECONDS: ${NOTIFICATION_RETRY_MAX_SECONDS:-3600}
      NOTIFICATION_ALERT_DEAD_LETTER_THRESHOLD: ${NOTIFICATION_ALERT_DEAD_LETTER_THRESHOLD:-1}
      NOTIFICATION_ALERT_FAILED_JOB_THRESHOLD: ${NOTIFICATION_ALERT_FAILED_JOB_THRESHOLD:-1}
      NOTIFICATION_ALERT_STALLED_MINUTES: ${NOTIFICATION_ALERT_STALLED_MINUTES:-15}
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://growth_ops:growth_ops@db:5432/growth_ops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      NOTIFICATION_RETRY_BASE_SECONDS: ${NOTIFICATION_RETRY_BASE_SECONDS:-60}
      NOTIFICATION_RETRY_MAX_SECONDS: ${NOTIFICATION_RETRY_MAX_SECONDS:-3600}
      NOTIFICATION_ALERT_DEAD_LETTER_THRESHOLD: ${NOTIFICATION_ALERT_DEAD_LETTER_THRESHOLD:-1}
      NOTIFICATION_ALERT_FAILED_JOB_THRESHOLD: ${NOTIFICATION_ALERT_FAILED_JOB_THRESHOLD:-1}
      NOTIFICATION_ALERT_STALLED_MINUTES: ${NOTIFICATION_ALERT_STALLED_MINUTES:-15}
    volumes:
      - ../apps/api:/app
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AI Growth Ops Platform}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-demo-header}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-demo-header}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_SECRET:-}
      AUTH0_SCOPE: ${AUTH0_SCOPE:-openid profile email}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
